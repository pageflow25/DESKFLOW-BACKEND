services:
  deskflow-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: deskflow-backend:local
    container_name: deskflow-backend
    env_file:
      - .env
    environment:
      DOWNLOAD_BASE_PATH: /data/bremen-ops
      PYTHONUNBUFFERED: "1"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ${DESKFLOW_LOGS_PATH:-./logs}:/app/logs
      - ${DESKFLOW_TEMP_PATH:-./temp_orcamentos}:/app/temp_orcamentos
      - ${DESKFLOW_DOWNLOADS_PATH:-./data/bremen-ops}:/data/bremen-ops
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
